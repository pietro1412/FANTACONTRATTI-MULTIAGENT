name: API-Football Backfill (Statistiche Storiche)

on:
  # schedule disabilitato il 2026-08-31: il piano free API-Football non copre più
  # la stagione corrente 2025-2026 (solo 2022-2024), il run fallirebbe ogni giorno.
  # Riattivare (rimuovere il commento sotto) solo dopo aver risolto lato piano API-Football.
  # schedule:
  #   - cron: '0 5 * * *'  # Ogni giorno alle 05:00 UTC
  workflow_dispatch: {}   # Permette un run manuale da GitHub

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Backfill statistiche partite mancanti (stagione 2025-2026)
        run: npx tsx scripts/sync-api-football.ts --backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
